ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.grupper.ApplicationKt.module ]
    }
    development = true
}

# Database configuration
database {
    # Development: H2 in-memory database (default)
    driverClassName = "org.h2.Driver"
    driverClassName = ${?DB_DRIVER}

    jdbcUrl = "jdbc:h2:mem:grupper;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    jdbcUrl = ${?DB_URL}

    username = "sa"
    username = ${?DB_USER}

    password = ""
    password = ${?DB_PASSWORD}

    # Connection pool settings
    maxPoolSize = 10
    maxPoolSize = ${?DB_MAX_POOL_SIZE}
}

# Example production PostgreSQL config (set via environment variables):
# DB_DRIVER=org.postgresql.Driver
# DB_URL=jdbc:postgresql://localhost:5432/grupper
# DB_USER=grupper
# DB_PASSWORD=your_password
