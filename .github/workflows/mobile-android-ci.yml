name: Mobile Android CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android-ci.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      working-directory: ./mobile
      run: chmod +x gradlew

    - name: Build Android Debug APK
      working-directory: ./mobile
      run: ./gradlew :composeApp:assembleDebug --no-daemon

    - name: Run unit tests
      working-directory: ./mobile
      run: ./gradlew :composeApp:testDebugUnitTest --no-daemon || true

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: grupper-debug-apk
        path: mobile/composeApp/build/outputs/apk/debug/*.apk
        retention-days: 7

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mobile-android-test-results
        path: mobile/composeApp/build/reports/tests/
        retention-days: 7
